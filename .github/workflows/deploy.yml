name: CI et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # GitHub Pages sert le site sous /<nom-du-repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Relais Cloudflare Worker (dossier worker/), déployé par le job « worker ».
          VITE_TCL_API_URL: https://api.quandpartir.workers.dev
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  worker:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          packageManager: npm
          secrets: |
            GRANDLYON_USER
            GRANDLYON_PASSWORD
        env:
          GRANDLYON_USER: ${{ secrets.GRANDLYON_USER }}
          GRANDLYON_PASSWORD: ${{ secrets.GRANDLYON_PASSWORD }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, worker]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
